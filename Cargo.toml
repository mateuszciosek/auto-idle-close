[package]
name = "auto-idle-close"
version = "0.4.0"
edition = "2024"
description = "Portable Windows tray utility that gracefully closes idle applications"
license = "MIT"
repository = "https://github.com/mateuszciosek/auto-idle-close"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
tray-icon = "0.24.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Graphics_Dwm", "Win32_Security", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_UI_Controls_Dialogs", "Win32_Globalization"] }

[build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
