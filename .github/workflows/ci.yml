name: CI

on:
  push:
    branches: ["master", "main"]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build release exe
        run: cargo build --release --locked

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-idle-close
          path: target/release/auto-idle-close.exe
          if-no-files-found: error

      # Inno Setup 6 is preinstalled on windows-latest runners (iscc on PATH).
      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          iscc /DAppVersion=$version installer\auto-idle-close.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-idle-close-setup
          path: target/installer/auto-idle-close-setup.exe
          if-no-files-found: error

  release:
    # Runs only when a version tag (v0.1.0, v1.2.3, ...) is pushed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built exe
        uses: actions/download-artifact@v4
        with:
          name: auto-idle-close

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: auto-idle-close-setup

      - name: Generate checksums and winget manifests
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sha256sum auto-idle-close.exe auto-idle-close-setup.exe > SHA256SUMS.txt
          SHA=$(sha256sum auto-idle-close.exe | cut -d' ' -f1)
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          mkdir -p winget

          cat > winget/MateuszCiosek.AutoIdleClose.yaml <<EOF
          PackageIdentifier: MateuszCiosek.AutoIdleClose
          PackageVersion: ${VERSION}
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: 1.6.0
          EOF

          cat > winget/MateuszCiosek.AutoIdleClose.installer.yaml <<EOF
          PackageIdentifier: MateuszCiosek.AutoIdleClose
          PackageVersion: ${VERSION}
          MinimumOSVersion: 10.0.0.0
          InstallerType: portable
          Commands:
          - auto-idle-close
          Installers:
          - Architecture: x64
            InstallerUrl: ${BASE}/auto-idle-close.exe
            InstallerSha256: ${SHA}
          ManifestType: installer
          ManifestVersion: 1.6.0
          EOF

          cat > winget/MateuszCiosek.AutoIdleClose.locale.en-US.yaml <<EOF
          PackageIdentifier: MateuszCiosek.AutoIdleClose
          PackageVersion: ${VERSION}
          PackageLocale: en-US
          Publisher: Mateusz Ciosek
          PublisherUrl: https://github.com/mateuszciosek
          PackageName: Auto Idle Close
          PackageUrl: https://github.com/${GITHUB_REPOSITORY}
          License: MIT
          LicenseUrl: https://github.com/${GITHUB_REPOSITORY}/blob/master/LICENSE
          ShortDescription: Portable Windows tray utility that gracefully closes idle applications
          Tags:
          - idle
          - tray
          - utility
          - auto-close
          ManifestType: defaultLocale
          ManifestVersion: 1.6.0
          EOF

          echo "--- SHA256SUMS.txt ---"; cat SHA256SUMS.txt
          echo "--- manifests ---"; ls -l winget/

      # Kept out of the visible release assets — grab them from the workflow
      # run's artifacts when submitting to microsoft/winget-pkgs.
      - name: Upload winget manifests as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifests
          path: winget/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            auto-idle-close.exe
            auto-idle-close-setup.exe
            SHA256SUMS.txt
          generate_release_notes: true
